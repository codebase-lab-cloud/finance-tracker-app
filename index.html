<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WiseSpend - Family Finance Tracker</title>
    <meta name="description" content="Track family expenses, savings, and income">
    <meta name="theme-color" content="#0f1115">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WiseSpend">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" sizes="32x32" href="wisespend-icon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="wisespend-icon-192.png">
    <link rel="apple-touch-icon" href="wisespend-icon-180.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{overflow-x:hidden;max-width:100vw}body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;transition:background-color .3s}
        [data-theme="dark"] body{background:#0f1115;color:#f8fafc}
        [data-theme="dark"] .lc{background:#1a1d24;border-color:#2e3440}
        [data-theme="dark"] .li{background:#262b36;border-color:#2e3440;color:#f8fafc}
        [data-theme="light"] body{background:#f3f4f6;color:#111827}
        [data-theme="light"] .lc{background:#fff;border-color:#e5e7eb}
        [data-theme="light"] .li{background:#f9fafb;border-color:#e5e7eb;color:#111827}
        .lc{border:1px solid;border-radius:1rem;padding:2.5rem;max-width:420px;width:100%;margin:1rem;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
        .li{border:1.5px solid;border-radius:.5rem;padding:.75rem 1rem;width:100%;outline:none;transition:all .2s;font-size:1rem;font-family:inherit}
        .li:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
        .lb{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:none;border-radius:.5rem;padding:.75rem 1.5rem;width:100%;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
        .lb:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.4)}
        .lb:disabled{opacity:.5;cursor:not-allowed;transform:none}
        .err{color:#ef4444;font-size:.85rem;margin-top:.5rem;min-height:1.2rem}
        .sp{display:none;width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
        @keyframes spin{to{transform:rotate(360deg)}}
        .fade{animation:fadeIn .5s ease-out forwards}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .tc{color:#94a3b8}.tc2{color:#64748b}
        [data-theme="light"] .tc{color:#4b5563}[data-theme="light"] .tc2{color:#9ca3af}
    </style>
</head>
<body>
    <div id="lock-screen" class="lc fade">
        <div style="margin-bottom:2rem">
            <div style="width:80px;height:80px;margin:0 auto 1.5rem;background:linear-gradient(135deg,#3b82f6,#2563eb);border-radius:50%;display:flex;align-items:center;justify-content:center">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h1 style="font-size:1.75rem;font-weight:700;margin-bottom:.25rem">WiseSpend</h1>
            <p class="tc2" style="font-size:.85rem;margin-bottom:.75rem">Family Finance Tracker</p>
        </div>
        
        <!-- GitHub Auth (only auth layer) -->
        <div id="token-step">
            <div style="margin-bottom:1rem">
                <p class="tc" style="font-size:.85rem;margin-bottom:1rem">Connect to your private repo:</p>
                <input type="text" id="gh-user-input" class="li" placeholder="GitHub Username" style="margin-bottom:.75rem" autocomplete="off">
                <input type="text" id="gh-repo-input" class="li" placeholder="Private Repo Name" style="margin-bottom:.75rem" autocomplete="off">
                <input type="password" id="gh-token-input" class="li" placeholder="Personal Access Token" autocomplete="off">
                <div class="err" id="token-error"></div>
            </div>
            <button class="lb" id="token-btn" onclick="handleToken()"><span id="token-btn-text">Connect and Load</span><div class="sp" id="token-spinner"></div></button>
            <p class="tc2" style="font-size:.75rem;margin-top:1rem">Token needs repo scope. Stored only in your browser.</p>
        </div>
        
        <div id="loading-step" style="display:none">
            <div class="sp" style="display:block;width:32px;height:32px;border-width:3px;margin:0 auto 1rem"></div>
            <p class="tc" style="font-size:.9rem" id="loading-text">Loading app...</p>
        </div>
    </div>
    
    <div id="app-container" style="display:none;width:100%;min-height:100vh;overflow-x:hidden"></div>

    <script>
    const SK={GHU:'fft_gh_user',GHR:'fft_gh_repo',TH:'family-finance-theme'};
    
    // Init theme
    (function(){var s=localStorage.getItem(SK.TH)||'dark';document.documentElement.setAttribute('data-theme',s)})();
    
    // Check if already authenticated
    (function(){
        var user=localStorage.getItem(SK.GHU);
        var repo=localStorage.getItem(SK.GHR);
        var token=window._ghToken;
        if(user&&repo&&token){
            // Already authenticated, load app directly
            document.getElementById('token-step').style.display='none';
            document.getElementById('loading-step').style.display='block';
            document.getElementById('loading-text').textContent='Loading app...';
            loadApp();
        }else if(user&&repo){
            // Have user/repo but no token - show token step with pre-filled values
            document.getElementById('gh-user-input').value=user;
            document.getElementById('gh-repo-input').value=repo;
            document.getElementById('gh-token-input').focus();
        }
    })();
    
    async function handleToken(){
        var user=document.getElementById('gh-user-input').value.trim();
        var repo=document.getElementById('gh-repo-input').value.trim();
        var token=document.getElementById('gh-token-input').value.trim();
        var err=document.getElementById('token-error');
        var btn=document.getElementById('token-btn');
        var txt=document.getElementById('token-btn-text');
        var sp=document.getElementById('token-spinner');
        
        if(!user||!repo||!token){err.textContent='Please fill all fields';return}
        err.textContent='';btn.disabled=true;txt.style.display='none';sp.style.display='block';
        
        try{
            var res=await fetch('https://api.github.com/repos/'+user+'/'+repo+'/contents/config.js',{headers:{'Authorization':'token '+token}});
            if(res.status===404){err.textContent='Repo or config.js not found.';btn.disabled=false;txt.style.display='inline';sp.style.display='none';return}
            if(res.status===401||res.status===403){err.textContent='Invalid token.';btn.disabled=false;txt.style.display='inline';sp.style.display='none';return}
            if(!res.ok)throw new Error('HTTP '+res.status);
            
            localStorage.setItem(SK.GHU,user);
            localStorage.setItem(SK.GHR,repo);
            window._ghToken=token;
            
            document.getElementById('token-step').style.display='none';
            document.getElementById('loading-step').style.display='block';
            await loadApp();
        }catch(e){
            err.textContent='Error: '+e.message;
            btn.disabled=false;txt.style.display='inline';sp.style.display='none';
        }
    }
    
    ['gh-user-input','gh-repo-input','gh-token-input'].forEach(function(id){
        document.getElementById(id).addEventListener('keydown',function(e){if(e.key==='Enter')handleToken()});
    });
    
    async function loadApp(){
        var user=localStorage.getItem(SK.GHU);
        var repo=localStorage.getItem(SK.GHR);
        var token=window._ghToken;
        if(!token){document.getElementById('token-step').style.display='block';document.getElementById('loading-step').style.display='none';return}
        
        var hdrs={'Authorization':'token '+token};
        try{
            updateL('Loading config...');
            var cfg=await ghFile(user,repo,'config.js',hdrs);
            updateL('Loading styles...');
            var css=await ghFile(user,repo,'style.css',hdrs);
            updateL('Loading app...');
            var js=await ghFile(user,repo,'app.js',hdrs);
            
            var cs=document.createElement('script');cs.textContent=cfg;document.head.appendChild(cs);
            var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
            
            await loadScript('https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js');
            await loadScript('https://cdn.jsdelivr.net/npm/chart.js');
            
            document.getElementById('lock-screen').style.display='none';
            document.getElementById('app-container').style.display='block';
            
            var as=document.createElement('script');as.textContent=js;document.body.appendChild(as);
        }catch(e){showErr('Failed: '+e.message)}
    }
    
    async function ghFile(u,r,p,h){
        var res=await fetch('https://api.github.com/repos/'+u+'/'+r+'/contents/'+p,{headers:h});
        if(!res.ok){if(res.status===404)throw new Error('File not found: '+p);throw new Error('Failed: '+p+' HTTP '+res.status)}
        var d=await res.json();
        var bin=atob(d.content.replace(/\n/g,''));
        var bytes=new Uint8Array(bin.length);
        for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
    }
    
    function loadScript(url){return new Promise(function(ok,no){var s=document.createElement('script');s.src=url;s.onload=ok;s.onerror=function(){no(new Error('Failed: '+url))};document.head.appendChild(s)})}
    
    function updateL(t){document.getElementById('loading-text').textContent=t}
    function showErr(m){document.getElementById('loading-step').style.display='none';document.getElementById('token-step').style.display='block';document.getElementById('token-error').textContent=m}
    </script>

</html>
